<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Periodic Table</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Interactive Periodic Table</h1>
      <p>Created by Muhammad Nabeel | Web Development Project</p>
    </header>

    <div class="controls">
      <button class="filter-btn active" data-category="all">
        All Elements
      </button>
      <button class="filter-btn" data-category="reactive-nonmetal">
        Reactive Nonmetals
      </button>
      <button class="filter-btn" data-category="noble-gas">Noble Gases</button>
      <button class="filter-btn" data-category="alkali-metal">
        Alkali Metals
      </button>
      <button class="filter-btn" data-category="alkaline-earth">
        Alkaline Earth
      </button>
      <button class="filter-btn" data-category="metalloid">Metalloids</button>
      <button class="filter-btn" data-category="post-transition">
        Post-Transition
      </button>
      <button class="filter-btn" data-category="transition-metal">
        Transition Metals
      </button>
      <button class="filter-btn" data-category="lanthanide">Lanthanides</button>
      <button class="filter-btn" data-category="actinide">Actinides</button>
    </div>

    <div class="periodic-table" id="periodic-table"></div>

    <div class="modal-overlay" id="modal">
      <div class="modal-card">
        <button class="close-btn" id="close-modal">&times;</button>
        <div class="modal-header">
          <div class="modal-symbol" id="m-symbol">H</div>
          <div class="modal-info">
            <h2 id="m-name">Hydrogen</h2>
            <p id="m-category">Reactive Nonmetal</p>
          </div>
        </div>
        <div class="modal-details">
          <div class="detail-item">
            <span>Atomic Number</span><strong id="m-number">1</strong>
          </div>
          <div class="detail-item">
            <span>Atomic Mass</span><strong id="m-mass">1.008 u</strong>
          </div>
          <div class="detail-item">
            <span>Group / Period</span><strong id="m-group">1 / 1</strong>
          </div>
          <div class="detail-item">
            <span>Phase</span><strong id="m-phase">Gas</strong>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 Muhammad Nabeel. Built with HTML, CSS & JS.</p>
    </footer>
    <script src="script.js" defer></script>
  </body>
</html>
